# Kurtosis config for testing EIP-8025 optional execution proofs end to end.
#
# Three roles:
#   - control:  no proof engine, imports payloads unconditionally. Keeps the chain alive so a
#               stalled consumer is distinguishable from a broken devnet.
#   - consumer: gates payload import on proofs from two distinct proof systems.
#   - seeder:   verifies and produces proofs, but does not gate. A producer cannot wait on a
#               proof it has not made yet.
#
# The seeder signs with validator 0's key, derived from the ethereum-package mnemonic. Consumers
# check that the index is active and that the signature verifies, so the key must be a real one.
participants:
  - cl_type: lighthouse
    cl_image: lighthouse:local
    el_type: geth
    el_image: ethpandaops/geth:master
    supernode: true
    count: 2
  - cl_type: lighthouse
    cl_image: lighthouse:local
    el_type: geth
    el_image: ethpandaops/geth:master
    supernode: true
    count: 2
    cl_extra_params:
      - --proof-engine-endpoint=http://mock-proof-engine:8025
  - cl_type: lighthouse
    cl_image: lighthouse:local
    el_type: geth
    el_image: ethpandaops/geth:master
    supernode: true
    validator_count: 0
    cl_extra_params:
      - --proof-engine-endpoint=http://mock-proof-engine:8025
      - --required-execution-proofs=0
      - --proof-producer-secret-key=0dce41fa73ae9f6bdfd51df4d422d75eee174553dba5fd450c4437e4ed3fc903
      - --proof-producer-validator-index=0
      - --proof-producer-types=0,1
network_params:
  gloas_fork_epoch: 0
  slot_duration_ms: 6000
  preset: "minimal"
global_log_level: debug
